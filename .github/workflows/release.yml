name: Release

on:
  push:
    tags:
      - 'android-v*'
      - 'ios-v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android Release
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install google-auth requests

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore

      - name: Create .env file
        run: |
          cat <<EOF > .env
          PEPPER=${{ secrets.PEPPER }}
          ANDROID_MAPS_API_KEY=${{ secrets.ANDROID_MAPS_API_KEY }}
          EOF

      - name: Create signing config in local.properties
        run: |
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Run unit tests
        run: make android-unit-test

      - name: Build, upload, and release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: python3 android/publish.py
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Build only (manual dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: make android-release-bundle

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-release:
    name: iOS Release
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install PyJWT cryptography requests

      - name: Create .env file
        run: |
          cat <<EOF > .env
          PEPPER=${{ secrets.PEPPER }}
          APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_KEY_ID=${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID=${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_P8="${{ secrets.APP_STORE_KEY_P8 }}"
          EOF

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%b\n' "${{ secrets.APP_STORE_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -project ios/IceBloxApp.xcodeproj \
            -scheme IceBloxApp \
            -resolvePackageDependencies

      - name: Run unit tests
        run: make ios-unit-test

      - name: Build, upload, and release
        run: python3 ios/publish.py
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_P8: ${{ secrets.APP_STORE_KEY_P8 }}
          APP_STORE_KEY_FILE: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ios/build/export/IceBloxApp.ipa
          if-no-files-found: error
